services:
  training:
    build: .
    init: true
    user: "${TRAINING_UID:-1000}:${TRAINING_GID:-1000}"
    ports:
      - "0.0.0.0:${TRAINING_PORT:-3001}:3001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/dashboard').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
